# docker-compose.yml
# No version field needed for Docker Compose v2.x

services:
  # =====================
  # PostgreSQL Database
  # =====================
  postgres:
    image: postgres:16-alpine
    container_name: rustyexpress-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rustyexpress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rustyexpress_secret}
      POSTGRES_DB: ${POSTGRES_DB:-rustyexpress}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rustyexpress} -d ${POSTGRES_DB:-rustyexpress}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rustyexpress-network

  # =====================
  # Rust Backend API
  # =====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: rustyexpress-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-rustyexpress}:${POSTGRES_PASSWORD:-rustyexpress_secret}@postgres:5432/${POSTGRES_DB:-rustyexpress}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-168}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rustyexpress-network

  # =====================
  # Nginx Frontend (optional, for production)
  # =====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: rustyexpress-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - rustyexpress-network

volumes:
  postgres_data:

networks:
  rustyexpress-network:
    driver: bridge
